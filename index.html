<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLIR Intake 05 - Call Verification Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel for in-browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col min-h-0"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Google Sheets API URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPITA1sNDDTEMGWMhYc3M3gg1fGCLOthio4JuROOE2qPCHcUtEr2LRzggNxaAEfz2mng/exec";

    // --- SVG ICONS ---
    const IconSearch = ({ className = "w-4 h-4" }) => ( <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg> );
    const IconPlus = ({ className = "w-4 h-4" }) => ( <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg> );

    // Status Badge Helper
    const getStatusStyle = (status) => {
      switch (status) {
        case 'Verified':
          return 'bg-green-100 text-green-800 border-green-300';
        case 'Rejected':
          return 'bg-red-100 text-red-800 border-red-300';
        case 'Follow Up':
          return 'bg-yellow-100 text-yellow-800 border-yellow-300';
        case 'Pending Calls':
        case 'Pending':
          return 'bg-slate-100 text-slate-800 border-slate-300';
        default:
          return 'bg-slate-100 text-slate-800 border-slate-300';
      }
    };

    function App() {
      const [intakeName, setIntakeName] = useState(() => localStorage.getItem('slir_intake_name') || 'SLIR Intake 05');
      const [batches] = useState(['Saturday Batch', 'Sunday Batch']);
      const [attendees, setAttendees] = useState([]);

      // Controls State
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBatch, setSelectedBatch] = useState('ALL');
      const [selectedStatus, setSelectedStatus] = useState('ALL');

      // Fetch data from Google Sheets on load
      useEffect(() => {
        fetch(SCRIPT_URL)
          .then(res => res.json())
          .then(result => {
            if (result.status === 'success' && result.data) {
              setAttendees(result.data);
            }
          })
          .catch(err => console.error("Error loading from Sheets:", err));
          
          // Dummy data for testing if API is empty/fails
          if(attendees.length === 0) {
              setAttendees([
                  { id: 1, name: 'Dilshan Electrical Eng', phone: '+94 77 009 0096', batch: 'Saturday Batch', status: 'Verified', date: '46301', notes: '', verifiedBy: '' },
                  { id: 2, name: 'Avishka Dilshan', phone: '+94 71 059 6628', batch: 'Sunday Batch', status: 'Follow Up', date: '46301', notes: 'Moved to sunday classs. Need to Add to Sunday Group', verifiedBy: 'Heshan' },
                  { id: 3, name: 'Lakshan Senarathna', phone: '+94 71 622 7550', batch: 'Saturday Batch', status: 'Rejected', date: '46301', notes: '', verifiedBy: '' },
                  { id: 4, name: 'Adithya', phone: '+94 76 170 8516', batch: 'Sunday Batch', status: 'Pending', date: '', notes: '', verifiedBy: '' }
              ]);
          }
      }, []);

      const filteredAttendees = useMemo(() => {
        return attendees.filter(a => {
          if (selectedBatch !== 'ALL' && a.batch !== selectedBatch) return false;
          if (selectedStatus !== 'ALL' && a.status !== selectedStatus) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return (a.name || '').toLowerCase().includes(q) || 
                   (a.phone || '').toLowerCase().includes(q) || 
                   (a.notes || '').toLowerCase().includes(q);
          }
          return true;
        });
      }, [attendees, selectedBatch, selectedStatus, searchQuery]);

      return (
        <div className="flex-1 flex flex-col min-h-0 bg-slate-50">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 shrink-0">
            <div className="max-w-[1400px] mx-auto px-4 py-3 flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold text-slate-900">{intakeName} - Dashboard</h1>
                <p className="text-xs text-slate-500 mt-0.5">Call Verification Tracker</p>
              </div>
              <button className="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm flex items-center gap-2 transition-colors">
                <IconPlus /> Add Contact
              </button>
            </div>
          </header>

          {/* Filter Toolbar */}
          <div className="bg-white border-b border-slate-200 shrink-0 shadow-sm">
            <div className="max-w-[1400px] mx-auto px-4 py-2 flex flex-wrap gap-4 items-center">
              {/* Search */}
              <div className="relative flex-1 min-w-[250px]">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <IconSearch className="text-slate-400" />
                </div>
                <input
                  type="text"
                  placeholder="Search name, phone, or notes..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="block w-full pl-9 pr-3 py-1.5 border border-slate-300 rounded-md text-sm placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                />
              </div>

              {/* Filters */}
              <div className="flex items-center gap-2">
                <span className="text-sm font-medium text-slate-600">Batch:</span>
                <select
                  value={selectedBatch}
                  onChange={(e) => setSelectedBatch(e.target.value)}
                  className="border border-slate-300 rounded-md text-sm py-1.5 pl-2 pr-8 focus:outline-none focus:border-blue-500 bg-white"
                >
                  <option value="ALL">All Batches</option>
                  <option value="Saturday Batch">Saturday Batch</option>
                  <option value="Sunday Batch">Sunday Batch</option>
                </select>
              </div>

              <div className="flex items-center gap-2">
                <span className="text-sm font-medium text-slate-600">Status:</span>
                <select
                  value={selectedStatus}
                  onChange={(e) => setSelectedStatus(e.target.value)}
                  className="border border-slate-300 rounded-md text-sm py-1.5 pl-2 pr-8 focus:outline-none focus:border-blue-500 bg-white"
                >
                  <option value="ALL">All Statuses</option>
                  <option value="Verified">Verified</option>
                  <option value="Follow Up">Follow Up</option>
                  <option value="Rejected">Rejected</option>
                  <option value="Pending">Pending</option>
                </select>
              </div>
            </div>
          </div>

          {/* Spreadsheet Data Grid */}
          <main className="max-w-[1400px] mx-auto w-full p-4 flex-1 min-h-0 overflow-hidden flex flex-col">
            <div className="bg-white border border-slate-200 rounded-lg shadow-sm flex-1 overflow-auto">
              <table className="min-w-full divide-y divide-slate-200 border-collapse">
                <thead className="bg-slate-100 sticky top-0 z-10">
                  <tr>
                    <th className="border border-slate-200 px-4 py-2.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider bg-slate-100">Contact Name</th>
                    <th className="border border-slate-200 px-4 py-2.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider bg-slate-100">Phone Number</th>
                    <th className="border border-slate-200 px-4 py-2.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider bg-slate-100">Batch</th>
                    <th className="border border-slate-200 px-4 py-2.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider bg-slate-100 text-center">Call Status</th>
                    <th className="border border-slate-200 px-4 py-2.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider bg-slate-100">Call Date</th>
                    <th className="border border-slate-200 px-4 py-2.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider bg-slate-100 w-1/3">Notes / Remarks</th>
                    <th className="border border-slate-200 px-4 py-2.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider bg-slate-100">Verified By</th>
                  </tr>
                </thead>
                <tbody className="bg-white divide-y divide-slate-200">
                  {filteredAttendees.length === 0 ? (
                    <tr>
                      <td colSpan="7" className="px-4 py-8 text-center text-sm text-slate-500">
                        No contacts found matching your filters.
                      </td>
                    </tr>
                  ) : (
                    filteredAttendees.map((task, index) => (
                      <tr key={task.id || index} className="hover:bg-blue-50/50 transition-colors">
                        <td className="border border-slate-200 px-4 py-2 text-sm text-slate-900 font-medium whitespace-nowrap">
                          {task.name || '-'}
                        </td>
                        <td className="border border-slate-200 px-4 py-2 text-sm text-slate-600 font-mono whitespace-nowrap">
                          {task.phone || '-'}
                        </td>
                        <td className="border border-slate-200 px-4 py-2 text-sm text-slate-600 whitespace-nowrap">
                          {task.batch || '-'}
                        </td>
                        <td className="border border-slate-200 px-4 py-2 text-center whitespace-nowrap">
                          <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold border ${getStatusStyle(task.status)}`}>
                            {task.status || 'Pending'}
                          </span>
                        </td>
                        <td className="border border-slate-200 px-4 py-2 text-sm text-slate-500 whitespace-nowrap">
                          {task.date || '-'}
                        </td>
                        <td className="border border-slate-200 px-4 py-2 text-sm text-slate-600">
                          {task.notes || ''}
                        </td>
                        <td className="border border-slate-200 px-4 py-2 text-sm text-slate-600 whitespace-nowrap">
                          {task.verifiedBy || ''}
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </main>
        </div>
      );
    }
    
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
