<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLIR Intake 05 - Call Verification Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel for in-browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100/70 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Google Sheets API URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPITA1sNDDTEMGWMhYc3M3gg1fGCLOthio4JuROOE2qPCHcUtEr2LRzggNxaAEfz2mng/exec";

    // --- SVG ICONS ---
    const IconPhone = ({ className = "w-4 h-4" }) => ( <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></svg> );
    const IconPlus = ({ className = "w-4 h-4" }) => ( <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg> );
    const IconSearch = ({ className = "w-4 h-4" }) => ( <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg> );
    const IconTrash = ({ className = "w-4 h-4" }) => ( <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg> );
    const IconPencil = ({ className = "w-4 h-4" }) => ( <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" /></svg> );
    const IconX = ({ className = "w-4 h-4" }) => ( <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg> );

    const COLUMNS = [
      { id: 'Pending', title: 'Pending Calls', badge: 'bg-amber-100 text-amber-900 border-amber-300' },
      { id: 'Follow Up', title: 'Follow Up', badge: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
      { id: 'Verified', title: 'Verified', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
      { id: 'Rejected', title: 'Rejected', badge: 'bg-rose-100 text-rose-800 border-rose-300' },
    ];

    function App() {
      const [intakeName, setIntakeName] = useState(() => localStorage.getItem('slir_intake_name') || 'SLIR Intake 05');
      const [batches, setBatches] = useState(() => {
        const saved = localStorage.getItem('slir_batches');
        return saved ? JSON.parse(saved) : ['Saturday Batch', 'Sunday Batch'];
      });

      const [attendees, setAttendees] = useState([]);

      // Fetch data from Google Sheets on load
      useEffect(() => {
        fetch(SCRIPT_URL)
          .then(res => res.json())
          .then(result => {
            if (result.status === 'success' && result.data) {
              setAttendees(result.data);
            }
          })
          .catch(err => console.error("Error loading from Sheets:", err));
      }, []);

      // Function to sync writes back to Google Sheet
      const syncToSheet = (payload) => {
        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        }).catch(err => console.error("Error syncing to Sheet:", err));
      };

      // UI States
      const [currentView, setCurrentView] = useState('board');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBatch, setSelectedBatch] = useState('ALL');
      const [selectedStatus, setSelectedStatus] = useState('ALL');
      const [modalMode, setModalMode] = useState(null);
      const [editingAttendee, setEditingAttendee] = useState(null);
      const [attendeeForm, setAttendeeForm] = useState({ name: '', phone: '', batch: 'Saturday Batch', status: 'Pending', level: 1, notes: '', verifiedBy: '', date: '' });
      const [intakeForm, setIntakeForm] = useState({ intakeName: 'SLIR Intake 06', batchCount: 2, batches: ['Saturday Batch', 'Sunday Batch'] });

      // Metrics
      const metrics = useMemo(() => {
        const total = attendees.length;
        const verified = attendees.filter(a => a.status === 'Verified').length;
        return { total, verified };
      }, [attendees]);

      const filteredAttendees = useMemo(() => {
        return attendees.filter(a => {
          if (selectedBatch !== 'ALL' && a.batch !== selectedBatch) return false;
          if (selectedStatus !== 'ALL' && a.status !== selectedStatus) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return a.name.toLowerCase().includes(q) || a.phone.toLowerCase().includes(q) || (a.notes && a.notes.toLowerCase().includes(q));
          }
          return true;
        });
      }, [attendees, selectedBatch, selectedStatus, searchQuery]);

      // Handlers
      const handleSaveAttendee = (e) => {
        e.preventDefault();
        const payload = { ...attendeeForm };
        
        if (editingAttendee) {
          setAttendees(prev => prev.map(a => a.id === editingAttendee.id ? { ...payload, id: a.id } : a));
          syncToSheet({ action: 'UPDATE', rowIndex: editingAttendee.rowIndex, ...payload });
        } else {
          payload.id = Date.now().toString();
          setAttendees(prev => [...prev, payload]);
          syncToSheet({ action: 'ADD', ...payload });
        }
        setModalMode(null);
        setEditingAttendee(null);
      };

      const handleDeleteAttendee = (id) => {
        if (confirm('Are you sure you want to delete this attendee?')) {
          setAttendees(prev => prev.filter(a => a.id !== id));
          // Note: Full delete integration requires Apps Script updates, this handles UI for now
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <h1 className="text-lg font-bold text-slate-900">{intakeName}</h1>
              <div className="flex gap-2">
                <button onClick={() => { setAttendeeForm({ name: '', phone: '', batch: batches[0], status: 'Pending', notes: '', verifiedBy: '', date: '' }); setEditingAttendee(null); setModalMode('attendee'); }} className="px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs">
                  + Add Attendee
                </button>
              </div>
            </div>
          </header>

          {/* Kanban Board */}
          <main className="max-w-7xl mx-auto w-full p-4 flex-1">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-start">
              {COLUMNS.map(col => {
                const colTasks = filteredAttendees.filter(a => a.status === col.id);
                return (
                  <div key={col.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-3 flex flex-col min-h-[350px]">
                    <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-200">
                      <span className="text-xs font-bold text-slate-800">{col.title}</span>
                      <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">{colTasks.length}</span>
                    </div>

                    <div className="space-y-2.5 flex-1 overflow-y-auto">
                      {colTasks.map(task => (
                        <div key={task.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                          <h4 className="text-xs font-bold text-slate-900">{task.name}</h4>
                          <div className="text-[11px] text-slate-500 font-mono mt-0.5">{task.phone}</div>
                          
                          <div className="mt-2 pt-2 border-t border-slate-100 flex items-center gap-1 overflow-x-auto text-[10px]">
                            <span className="text-slate-400">Move:</span>
                            {COLUMNS.filter(c => c.id !== task.status).map(c => (
                              <button key={c.id} onClick={() => {
                                setAttendees(prev => prev.map(a => a.id === task.id ? { ...a, status: c.id } : a));
                                syncToSheet({ action: 'UPDATE', rowIndex: task.rowIndex, status: c.id });
                              }} className="px-1.5 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">
                                {c.title}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
